# SPDX-License-Identifier: Apache-2.0
# models-aux (M0.4): fp32 CPU baseline. Revisions are Hugging Face commit hashes; changing a
# model, revision, dtype, or max_length needs an eval delta (06). int8/ONNX only as a later,
# measured optimization. Licences as declared on each model card (checked 2026-11-05).
torch_threads: 8 # [TUNE] physical cores on cpu-local
max_batch: 32 # [TUNE]
max_wait_ms: 5 # [TUNE]
max_inputs: 64
max_chars: 8000
models:
  embed:
    repo: BAAI/bge-m3
    # Last official BAAI commit on main that ships model.safetensors (later commits deleted it
    # without a stated reason). Tensors verified bit-identical to pytorch_model.bin at
    # 5617a9f6 (391 fp32 tensors); config and tokenizer files are identical (SEC-13).
    revision: 7b44caba5c06fd6f1ef1d2786261e636c38e4295
    license: MIT
    # Dense vectors (CLS pooling, L2-normalized) for retrieval. The ColBERT head gives
    # multi-vectors on request (M1.6), cached for the M1.10 rerank experiment only. It ships
    # only as a pickle: `make models-download` checks its hash, scans it, loads it with
    # weights_only=True and writes safetensors; the service loads only that output (ADR-020).
    # Sparse head unused (it would follow the same path).
    max_length: 512 # [TUNE] tokens; longer inputs are truncated
    allow_patterns: [config.json, model.safetensors, tokenizer.json, tokenizer_config.json, special_tokens_map.json, sentencepiece.bpe.model, colbert_linear.pt]
    convert:
      colbert_linear.pt:
        sha256: 19bfbae397c2b7524158c919d0e9b19393c5639d098f0a66932c91ed8f5f9abb
        output: colbert_linear.safetensors
        output_sha256: ff52a5f08a3579dbabd1baa2a2e5ecc0c30179511f63a8edd2c25978f5bfb443
  rerank:
    repo: BAAI/bge-reranker-v2-m3
    revision: 953dc6f6f85a1b2dbfca4c34a2796e7dde08d41e
    license: Apache-2.0
    max_length: 512 # [TUNE]
    allow_patterns: [config.json, model.safetensors, tokenizer.json, tokenizer_config.json, special_tokens_map.json, sentencepiece.bpe.model]
  nli:
    repo: MoritzLaurer/mDeBERTa-v3-base-xnli-multilingual-nli-2mil7
    revision: b5113eb38ab63efdd7f280f8c144ea8b13f978ce
    license: MIT
    max_length: 512 # [TUNE]
    allow_patterns: [config.json, model.safetensors, tokenizer.json, tokenizer_config.json, special_tokens_map.json, added_tokens.json, spm.model]
