[project]
name = "pdpgraph-common"
version = "0.0.0"
description = "Shared telemetry, config, logging, IDs, and LLM client"
requires-python = ">=3.12,<3.13"
dependencies = [
    "opentelemetry-api>=1.45.2,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.45.2,<2",
    "opentelemetry-sdk>=1.45.2,<2",
    "pydantic>=2.14.2,<3",
    "pydantic-settings[yaml]>=2.16.2,<3",
    "structlog>=26.1.0,<27",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "common"
