[project]
name = "pdp-core"
version = "0.0.0"
description = "PDPGraph core: schemas, query pipeline, retrieval, verification, gap analysis"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "neo4j>=5.28,<7",
    "pdpgraph-common",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.uv.sources]
pdpgraph-common = { workspace = true }
