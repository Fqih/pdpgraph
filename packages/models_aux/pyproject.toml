[project]
name = "models-aux"
version = "0.0.0"
description = "CPU embedding, rerank, and NLI service"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.162.0,<0.163",
    "huggingface-hub>=2.4.0,<3",
    "pdpgraph-common",
    "torch>=2.15.0,<2.16",
    "transformers>=5.22.1,<6",
    "uvicorn>=0.54.0,<0.55",
]

[tool.uv.sources]
pdpgraph-common = { workspace = true }
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
