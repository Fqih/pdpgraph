[project]
name = "pdp-ingest"
version = "0.0.0"
description = "PDPGraph ingestion CLI and stages"
requires-python = ">=3.12,<3.13"
dependencies = [
    "httpx>=0.28.1,<0.29",
    "pdp-core",
    "pdpgraph-common",
    "pypdf>=5",
    "pyyaml>=6.0.3,<7",
]

[tool.uv.sources]
pdpgraph-common = { workspace = true }
pdp-core = { workspace = true }

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
