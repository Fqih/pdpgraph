name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the gitleaks scan

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install workspace
        run: make sync

      - name: Lint and type-check
        run: make lint

      - name: Tests + coverage gate (NFR-10)
        run: make cov

      - name: Pre-commit hygiene hooks
        run: make check

      # The pre-commit gitleaks hook only scans staged changes, so CI scans full history.
      - name: Secret scan (SEC-11)
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose --exit-code 1

  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install workspace
        run: make sync

      - name: Throwaway store passwords (never stored)
        run: |
          umask 077
          for v in NEO4J_PASSWORD POSTGRES_PASSWORD VALKEY_PASSWORD; do
            echo "$v=$(openssl rand -hex 16)" >> .env
          done

      - name: Start core stores (M0.2)
        run: make up

      - name: Integration tests
        run: make test-int

      - name: Store logs on failure
        if: failure()
        run: docker compose --project-directory . -f deploy/compose/compose.yaml --profile core logs --tail 200

      - name: Tear down
        if: always()
        run: make down
