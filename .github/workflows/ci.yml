name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # full history for the gitleaks scan

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install workspace
        run: make sync

      - name: Lint and type-check
        run: make lint

      - name: Tests
        run: make test

      - name: Pre-commit hygiene hooks
        run: uv run --frozen pre-commit run --all-files --show-diff-on-failure

      # The pre-commit gitleaks hook only scans staged changes, so CI scans full history.
      - name: Secret scan (SEC-11)
        run: >
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --redact --verbose --exit-code 1
