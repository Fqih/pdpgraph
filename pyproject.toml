# Virtual uv workspace root: no installable project here, only shared tooling config.
# Members live in packages/<name>/ (src layout, py.typed). Install everything with
# `uv sync --all-packages`.

[tool.uv]
required-version = ">=0.12,<0.13"

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "hypothesis>=6.170.14,<7",
    "mypy>=2.4.1,<3",
    "pre-commit>=4.7.0,<5",
    "pytest>=9.2.0,<10",
    "pytest-cov>=7.1.0,<8",
    "ruff>=0.17.3,<0.18",
    "types-pyyaml>=6.0.12,<7",
]

[tool.ruff]
line-length = 100
target-version = "py312"
# Python files only: ruff 0.17 also formats code blocks in Markdown, and the
# .context/ specs must not be rewritten by tooling.
include = ["*.py", "*.pyi"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "N", "S", "PT", "PTH", "TID"]
ignore = []

[tool.ruff.lint.isort]
known-first-party = [
    "common",
    "models_aux",
    "pdp_api",
    "pdp_core",
    "pdp_ingest",
    "pdp_mcp",
    "tierline",
    "tierline_router_train",
]

[tool.ruff.lint.per-file-ignores]
"**/tests/**" = ["S101"]
"tests/**" = ["S101"]

[tool.mypy]
# Strict everywhere by default; NFR-10 requires strict for pdp_core, tierline, common.
# Other packages are relaxed to "regular mode" in the override below.
python_version = "3.12"
strict = true
warn_unreachable = true
files = ["packages/*/src", "tests"]
mypy_path = [
    "packages/common/src",
    "packages/models_aux/src",
    "packages/pdp_api/src",
    "packages/pdp_core/src",
    "packages/pdp_ingest/src",
    "packages/pdp_mcp/src",
    "packages/tierline/src",
    "packages/tierline_router_train/src",
]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "models_aux.*",
    "pdp_api.*",
    "pdp_ingest.*",
    "pdp_mcp.*",
    "tierline_router_train.*",
]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false
disallow_untyped_decorators = false
disallow_any_generics = false
warn_return_any = false
check_untyped_defs = true

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["packages", "tests"]
addopts = [
    "--import-mode=importlib",
    "--strict-markers",
    "--strict-config",
    "-ra",
    "-m", "not integration and not snapshot and not eval_smoke",
]
markers = [
    "integration: needs the compose stack (make up); run with make test-int",
    "snapshot: ingestion snapshot tests on the real source (EV-03)",
    "eval_smoke: 30-item replay eval (EV-01)",
]
xfail_strict = true
